# tag_nav parameters for the DEXI 5 v1 (ARK Pi6X + CM4), measured on the aircraft.
# Mount values are per airframe: measure them, never copy them.
tag_nav:
  ros__parameters:
    # Mount: lens center 105 mm ahead of the frame center, on the centerline,
    # camera axes aligned with body forward/right (tape-measured 2026-10-01; a
    # bench check with the tag centered in the image read 3 cm).
    camera_forward_offset: 0.105
    camera_right_offset: 0.0
    camera_yaw_deg: 0.0
    tag_scale: 1.0
    tag_family: tag36h11

    # Chase (velocity) stage
    centering_speed: 0.20
    centering_taper_dist: 0.30
    centering_min_speed: 0.0
    filter_length: 5

    # Hold (position) stage
    hold_enter: 0.25
    hold_exit: 0.40
    hold_alpha: 0.8
    hold_nudge: 0.25
    hold_nudge_max: 0.012
    hold_settled_m: 0.35
    hold_settled_v: 0.12
    hold_accept_s: 8.0
    hold_command: hold_ned
    centering_gate: 0.10
    centering_settle: 0.7

    # Loss handling
    tag_stale_s: 0.5
    tag_loss_grace: 3.0
    centering_loss_timeout: 8.0

    # Altitude hold in the chase stage
    hold_altitude: true
    alt_kz: 1.0
    alt_max_rate: 0.3

    # Gates
    require_airborne: true
    min_airborne_alt: 0.30
    require_offboard: true
    dry_run: false
    # Hand-off from RC: aux channel index (1..6, 0 = none). The original corridor script used aux2 (= RC channel 9).
    engage_aux_index: 0   # one engage path: the Offboard switch (RC_MAP_OFFB_SW); aux-channel engage off
    engage_aux_threshold: 0.5
    # ch7 is the PX4 offboard switch (RC_MAP_OFFB_SW=7); entering Offboard is the go.
    engage_on_offboard: true
    transit_min_s: 0.5
    transit_confirm: 2
    loop_hz: 20.0
    command_hz: 10.0
